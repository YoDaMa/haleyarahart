<!DOCTYPE html>
<!-- Template for assets/img/og.jpg (the picture shown when the site's link is
     shared). Render at 1200×630 with tools/render-og.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 44px 48px; }
  .card .row { font-size: 17px; }
  .card h1 {
    margin: 22px 0 0 -0.0469em; font-family: var(--sans); font-weight: 700;
    font-size: calc(1104px / 5.5538); line-height: 0.86; letter-spacing: -0.045em; white-space: nowrap;
  }
  .card ul { display: flex; align-items: flex-end; gap: 14px; margin: 46px 0 0; padding: 0; list-style: none; }
  .card .plate { padding: 9px; --mark: 12px; }
  .card img { display: block; height: 214px; width: auto; }
</style>
</head>
<body>
  <div class="card">
    <p class="row"><span>Paintings</span><i></i><span>Index</span><i></i><span>Fig. 01–09</span></p>
    <h1>Haley Pannell</h1>
    <ul>
      <li><span class="plate"><img src="../../assets/img/works/01-640.jpg" alt=""></span></li>
      <li><span class="plate"><img src="../../assets/img/works/05-640.jpg" alt=""></span></li>
      <li><span class="plate"><img src="../../assets/img/works/04-640.jpg" alt=""></span></li>
      <li><span class="plate"><img src="../../assets/img/works/06-640.jpg" alt=""></span></li>
      <li><span class="plate"><img src="../../assets/img/works/08-640.jpg" alt=""></span></li>
      <li><span class="plate"><img src="../../assets/img/works/09-640.jpg" alt=""></span></li>
    </ul>
  </div>
</body>
</html>
